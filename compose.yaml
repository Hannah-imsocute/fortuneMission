services:
  app:
    build: .
    image: fortune-mission:local
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollamaContainer:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180s}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    restart: unless-stopped
    networks:
      - ollama

networks:
  ollama:
    external: true
    name: ${OLLAMA_NETWORK:-fortune-network}
